<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triviallica — Splash (C)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../styles/alt.css">
  <style>
    .splash {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .splash .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 38%;
      z-index: 0;
    }

    .splash::before {
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(6,5,14,0.35) 0%, transparent 25%, transparent 55%, rgba(6,5,14,0.85) 88%, var(--cd-bg) 100%);
      z-index: 1;
    }

    .torneo-meta {
      position: absolute;
      top: 54px; left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      text-align: center;
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cd-muted);
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    }

    .bottom {
      position: absolute;
      bottom: 50px;
      left: 0; right: 0;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .by-mark {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cd-muted);
    }
    .by-mark img {
      height: 50px;
      filter: drop-shadow(0 0 10px rgba(123, 107, 255, 0.5)) drop-shadow(0 0 22px rgba(74, 61, 200, 0.4));
    }

    .progress {
      width: 160px;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress .fill {
      height: 100%;
      width: 72%;
      background: linear-gradient(90deg, var(--cd-mg), var(--cd-cyan));
      box-shadow: 0 0 8px var(--cd-mg);
      border-radius: 2px;
    }

    .loading-label {
      font-size: 9px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cd-dim);
    }
  </style>
</head>
<body class="alt-body">
  <div class="phone">
    <div class="status-bar">
      <span style="color:#fff; text-shadow: 0 1px 6px rgba(0,0,0,0.7);">9:41</span>
      <div class="icons">
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <span style="font-size:10px;">5G</span>
        <div class="bat"><div class="fill"></div></div>
      </div>
    </div>

    <div class="splash">
      <img class="bg" src="../../assets/triviallica-concept.png" alt="Triviallica">

      <div class="torneo-meta">TORNEO #001 · METALLICA</div>

      <div class="bottom">
        <span class="by-mark">
          by
          <img src="../../assets/sonao-neon.png" alt="Soñao">
        </span>
        <div class="progress"><div class="fill"></div></div>
        <span class="loading-label">cargando</span>
      </div>
    </div>

    <div class="home-indicator"></div>
  </div>
  <script src="../../scripts/nav.js" defer></script>
</body>
</html>
