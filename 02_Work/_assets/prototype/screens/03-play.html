<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triviallica — En vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Metal+Mania&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/base.css">
  <link rel="stylesheet" href="../styles/triviallica.css">
  <style>
    .play-screen { padding: 2.5rem 4rem; min-height: 100vh; display: flex; flex-direction: column; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255, 47, 184, 0.15);
    }
    .top-bar .brand { display: flex; align-items: center; gap: 1.2rem; }
    .brand .logo-wm { font-family: "Metal Mania", sans-serif; font-size: 1.6rem; color: var(--magenta-glow); text-shadow: 0 0 8px var(--magenta), 0 0 20px var(--magenta-deep); letter-spacing: 0.05em; }
    .brand .by-sonao .sonao-mark { height: 1.5em; }

    .live-pill {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--red);
      border-radius: 100px;
      font-family: var(--font-display); font-size: 0.7rem;
      letter-spacing: 0.3em; text-transform: uppercase;
      color: var(--red-glow);
      text-shadow: 0 0 6px var(--red);
      box-shadow: 0 0 10px var(--red-deep);
    }
    .live-dot {
      width: 8px; height: 8px; background: var(--red-glow); border-radius: 50%;
      box-shadow: 0 0 8px var(--red), 0 0 16px var(--red);
      animation: dot-pulse 1.4s infinite;
    }
    @keyframes dot-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    .meta-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 2rem;
      align-items: center;
      padding: 1.6rem 0;
      margin-top: 0.5rem;
    }
    .meta-cell .label { margin-bottom: 0.35rem; display: block; }
    .meta-cell .val { font-family: var(--font-display); font-size: 1.4rem; color: var(--text-0); letter-spacing: 0.06em; }
    .meta-cell.timer .val { color: var(--magenta-glow); text-shadow: 0 0 6px var(--magenta), 0 0 18px var(--magenta-deep); font-size: 2rem; }

    .difficulty {
      display: inline-flex; gap: 3px; align-items: center;
    }
    .difficulty .bar {
      width: 14px; height: 14px; border: 1px solid var(--magenta);
      transform: rotate(45deg);
    }
    .difficulty .bar.on {
      background: var(--magenta);
      box-shadow: 0 0 8px var(--magenta), 0 0 20px var(--magenta-deep);
    }

    .question-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      padding: 2rem 0;
    }

    .q-meta {
      display: flex; gap: 2rem; margin-bottom: 2rem; align-items: center;
    }
    .q-number {
      font-family: var(--font-display);
      color: var(--magenta-glow);
      text-shadow: 0 0 6px var(--magenta);
      font-size: 0.9rem;
      letter-spacing: 0.28em;
    }
    .q-progress {
      display: flex; gap: 4px; flex: 1;
    }
    .q-progress .seg {
      flex: 1; height: 3px;
      background: rgba(255, 47, 184, 0.15);
    }
    .q-progress .seg.done { background: var(--magenta); box-shadow: 0 0 6px var(--magenta); }
    .q-progress .seg.current { background: var(--magenta-glow); box-shadow: 0 0 8px var(--magenta-glow); }

    .question {
      font-family: var(--font-body);
      font-size: 2.4rem;
      font-weight: 500;
      line-height: 1.2;
      color: var(--text-0);
      margin-bottom: 2.8rem;
      max-width: 900px;
      letter-spacing: -0.01em;
    }
    .question em {
      font-style: normal;
      color: var(--magenta-glow);
      text-shadow: 0 0 8px var(--magenta), 0 0 20px var(--magenta-deep);
      font-weight: 600;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      max-width: 900px;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1.6rem;
      border-top: 1px solid rgba(255, 47, 184, 0.15);
    }

    .stat {
      display: inline-flex; align-items: baseline; gap: 0.6rem;
    }
    .stat .v {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      color: var(--text-0);
      font-weight: 600;
    }
    .stat .v.accent {
      color: var(--magenta-glow);
      text-shadow: 0 0 6px var(--magenta);
    }
    .stat .l {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-2);
    }

    .rank-pill {
      display: inline-flex; align-items: center; gap: 0.7rem;
      padding: 0.5rem 1.1rem;
      border: 1px solid var(--magenta);
      box-shadow: 0 0 10px var(--magenta-deep);
    }
    .rank-pill .l { font-size: 0.65rem; letter-spacing: 0.26em; text-transform: uppercase; color: var(--text-2); }
    .rank-pill .v { font-family: var(--font-display); color: var(--magenta-glow); text-shadow: 0 0 6px var(--magenta); font-size: 1.1rem; }

    @media (max-width: 768px) {
      .play-screen { padding: 1.5rem 1.2rem; }
      .top-bar { flex-direction: column; gap: 0.8rem; align-items: flex-start; padding-bottom: 1rem; }
      .meta-row { grid-template-columns: 1fr; gap: 0.8rem; padding: 1rem 0; text-align: left; }
      .meta-row .meta-cell.timer { justify-content: flex-start !important; }
      .meta-row .meta-cell.timer > div { text-align: left; }
      .meta-row .meta-cell:last-child { text-align: left !important; }
      .meta-cell.timer .val { font-size: 1.6rem; }
      .question { font-size: 1.6rem; margin-bottom: 1.8rem; }
      .options { grid-template-columns: 1fr; gap: 0.7rem; }
      .option { padding: 1.1rem 1.3rem; font-size: 1rem; }
      .bottom-bar { flex-wrap: wrap; gap: 1rem; padding-top: 1.2rem; }
      .q-meta { flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1.4rem; }
      .q-progress { order: 2; width: 100%; }
    }
    @media (max-width: 480px) {
      .question { font-size: 1.25rem; }
      .brand .logo-wm { font-size: 1.3rem; }
    }
  </style>
</head>
<body class="skin-triviallica grain vignette">
  <div class="grunge-bg"></div>

  <div class="screen play-screen">
    <header class="top-bar">
      <div class="brand">
        <span class="logo-wm flicker">TRIVIALLICA</span>
        <span class="by-sonao">
          by
          <img class="sonao-mark" src="../assets/sonao-neon.png" alt="Soñao">
        </span>
      </div>
      <span class="live-pill">
        <span class="live-dot"></span>
        En vivo
      </span>
    </header>

    <div class="meta-row">
      <div class="meta-cell">
        <span class="label">Dificultad</span>
        <div class="difficulty">
          <span class="bar on"></span>
          <span class="bar on"></span>
          <span class="bar on"></span>
          <span class="bar"></span>
        </div>
      </div>
      <div class="meta-cell timer center" style="justify-content: center;">
        <div style="text-align: center;">
          <span class="label">Tiempo</span>
          <div class="val mono">00:14</div>
        </div>
      </div>
      <div class="meta-cell" style="text-align: right;">
        <span class="label">Valor</span>
        <div class="val">+100 pts</div>
      </div>
    </div>

    <main class="question-area">
      <div class="q-meta">
        <span class="q-number">PREGUNTA 07 / 15</span>
        <div class="q-progress">
          <span class="seg done"></span><span class="seg done"></span><span class="seg done"></span>
          <span class="seg done"></span><span class="seg done"></span><span class="seg done"></span>
          <span class="seg current"></span>
          <span class="seg"></span><span class="seg"></span><span class="seg"></span>
          <span class="seg"></span><span class="seg"></span><span class="seg"></span>
          <span class="seg"></span><span class="seg"></span>
        </div>
      </div>

      <h1 class="question">
        ¿En qué álbum apareció <em>"One"</em> por primera vez?
      </h1>

      <div class="options">
        <button class="option">
          <span class="letter">A</span>
          Kill 'Em All
        </button>
        <button class="option">
          <span class="letter">B</span>
          Master of Puppets
        </button>
        <button class="option">
          <span class="letter">C</span>
          …And Justice for All
        </button>
        <button class="option">
          <span class="letter">D</span>
          The Black Album
        </button>
      </div>
    </main>

    <footer class="bottom-bar">
      <div class="stat">
        <span class="v accent mono">1,247</span>
        <span class="l">jugando ahora</span>
      </div>
      <div class="stat">
        <span class="v mono">842</span>
        <span class="l">aún en carrera</span>
      </div>
      <div class="rank-pill">
        <span class="l">Tu ranking</span>
        <span class="v">#47</span>
      </div>
    </footer>
  </div>
</body>
</html>
